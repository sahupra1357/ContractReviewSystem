name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crs
          POSTGRES_PASSWORD: crs
          POSTGRES_DB: crs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crs -d crs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Apply migrations
        working-directory: backend
        env:
          CRS_DATABASE_URL: postgresql+psycopg://crs:crs@localhost:5432/crs
        run: uv run alembic upgrade head
      - name: Unit + invariant tests
        working-directory: backend
        env:
          CRS_RUN_INVARIANT_TESTS: "1"
          CRS_DATABASE_URL: postgresql+psycopg://crs:crs@localhost:5432/crs
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
