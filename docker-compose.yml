# Contract Review Co-Pilot — POC stack (AWS-shaped; mapping in docs/03 §7)
# One-command boot: docker compose up -d   (Gate G0 requirement)

services:
  postgres:                       # → Aurora PostgreSQL + pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crs
      POSTGRES_PASSWORD: crs
      POSTGRES_DB: crs
    ports:
      - "5433:5432"   # host 5433: avoids clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crs -d crs"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:                          # → S3 + KMS
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:                     # creates raw/ masked/ audit/ buckets (design doc §5.3)
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw local/masked local/audit &&
      exit 0"

  presidio-analyzer:              # → Presidio on ECS/EKS in-VPC
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5002:3000"

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5001:3000"

  backend:                        # → API Gateway + Lambda/ECS
    build: ./backend
    environment:
      CRS_DATABASE_URL: postgresql+psycopg://crs:crs@postgres:5432/crs
      CRS_S3_ENDPOINT_URL: http://minio:9000
      CRS_PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      CRS_PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
      CRS_ENVIRONMENT: compose
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:                         # → ECS/EKS pipeline workers (SQS consumers)
    build: ./backend
    command: python -m backend.worker
    environment:
      CRS_DATABASE_URL: postgresql+psycopg://crs:crs@postgres:5432/crs
      CRS_S3_ENDPOINT_URL: http://minio:9000
      CRS_PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      CRS_PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
      CRS_ENVIRONMENT: compose
    volumes:
      - hfcache:/root/.cache/huggingface   # BGE model weights, downloaded once
    depends_on:
      backend:                     # backend applies migrations first
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  hfcache:
