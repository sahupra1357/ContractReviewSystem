# Render Blueprint — Contract Review Co-Pilot DEMO deployment
#
# ⚠ SYNTHETIC DATA ONLY. This hosts the C-level demo with the generated
# corpus. Never upload real contracts to a PaaS instance — production is the
# in-VPC AWS architecture (docs/03_design_document.md §7).
#
# After the first deploy:
#   1. Set ANTHROPIC_API_KEY, CRS_EMBEDDING_API_KEY and CRS_DEMO_PASSWORD in
#      the dashboard (sync: false).
#   2. Open a shell on `crs-backend` → `python -m backend.seed_demo`.
#   3. Verify the internal service hostnames below match the dashboard's
#      "internal address" for each private service (Render assigns
#      <name>:<port>); adjust env vars if they differ.

previews:
  generation: off

databases:
  - name: crs-postgres
    plan: basic-1gb
    postgresMajorVersion: "16"   # pgvector: CREATE EXTENSION runs in migration 0004

services:
  # ---------- API + React UI ----------
  - type: web
    name: crs-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: standard            # extraction fast path + API; no ML inference here
    healthCheckPath: /health
    envVars: &app_env
      - key: CRS_DATABASE_URL
        fromDatabase:
          name: crs-postgres
          property: connectionString   # postgres:// — normalized in db.py
      - key: CRS_S3_ENDPOINT_URL
        value: http://crs-minio:9000
      - key: CRS_S3_ACCESS_KEY
        fromService: { type: pserv, name: crs-minio, envVarKey: MINIO_ROOT_USER }
      - key: CRS_S3_SECRET_KEY
        fromService: { type: pserv, name: crs-minio, envVarKey: MINIO_ROOT_PASSWORD }
      - key: CRS_PRESIDIO_ANALYZER_URL
        value: http://crs-presidio-analyzer:3000
      - key: CRS_PRESIDIO_ANONYMIZER_URL
        value: http://crs-presidio-anonymizer:3000
      - key: CRS_JWT_SECRET
        generateValue: true
      - key: CRS_DEMO_PASSWORD
        sync: false            # set in dashboard; used by seed_demo
      - key: ANTHROPIC_API_KEY
        sync: false            # set in dashboard; profile mounts don't exist on Render
      # Hosted embeddings (2026-08-13). Render passes env vars as Docker build
      # args, so CRS_EXTRAS reaches the Dockerfile's ARG and drops torch:
      # 8.66GB image -> ~697MB, and the worker needs no model weights or disk.
      # Reverting to the design's self-hosted default = delete these four keys,
      # restore the worker's hf-cache disk, and raise its plan back to pro.
      - key: CRS_EXTRAS
        value: openai
      - key: CRS_EMBEDDING_PROVIDER
        value: openai
      - key: CRS_EMBEDDING_MODEL
        value: text-embedding-3-small   # requested at 1024 dims = EMBEDDING_DIM
      - key: CRS_EMBEDDING_API_KEY
        sync: false            # set in dashboard
      - key: CRS_ENVIRONMENT
        value: render-demo

  # ---------- pipeline worker (OCR + hosted embeddings; no local model) ----------
  - type: worker
    name: crs-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.worker
    # Peak memory is now OCR, not inference: one batch of CRS_OCR_BATCH_SIZE
    # rasterized pages (default 16). Was `pro` (~8GB) for torch + BGE-M3.
    plan: standard
    # No disk: embeddings are an API call, so there are no model weights to
    # cache. Restore the hf-cache disk alongside CRS_EMBEDDING_PROVIDER=bge-m3.
    envVars: *app_env

  # ---------- object store (raw / masked / audit zones) ----------
  - type: pserv
    name: crs-minio
    runtime: image
    image:
      url: docker.io/minio/minio:latest
    dockerCommand: minio server /data --address ":9000"
    plan: starter
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: MINIO_ROOT_USER
        generateValue: true
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  # ---------- PII gate services ----------
  - type: pserv
    name: crs-presidio-analyzer
    runtime: image
    image:
      url: mcr.microsoft.com/presidio-analyzer:latest
    plan: standard             # spaCy NER model needs ~2GB
  - type: pserv
    name: crs-presidio-anonymizer
    runtime: image
    image:
      url: mcr.microsoft.com/presidio-anonymizer:latest
    plan: starter
